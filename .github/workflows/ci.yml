
name: T-REX CI

# Run when code is pushed or a Pull Request is created
on:
  push:
    branches:
      - main
      - feature/project-code

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build T-REX
    runs-on: ubuntu-latest

    steps:
      # 1. Get the project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the project
      - name: Build project
        run: npm run build