
name: T-REX CI

on:
  push:
    branches:
      - main
      - feature/project-code

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build T-REX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
